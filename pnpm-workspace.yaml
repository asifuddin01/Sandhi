confirmModulesPurge: false

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false

# Patched releases for advisories reached only through the Prisma CLI
# (Studio's charts, MySQL support, and config loading). lodash and mysql2 stay
# within their major version; deepmerge-ts 8 keeps the API @prisma/config uses.
overrides:
  deepmerge-ts: ^8.0.0
  lodash: ^4.18.1
  mysql2: ^3.23.4
  # GHSA-6j4f-fj2g-mc7p and its sibling: stack exhaustion from nested brace
  # groups. Reached only through ESLint's glob matching (minimatch), so only
  # on a developer's machine and in CI — nothing in the served app. Two
  # majors are in use, and each is pinned within its own so every tool keeps
  # the API it was written against.
  brace-expansion@1: ^1.1.20
  brace-expansion@5: ^5.0.11
  # GHSA-hrr3-gc8f-f4qj (moderate): inconsistent host case normalisation via
  # percent-encoding. Only moderate, so the audit gate passes without it — but
  # it is reached through better-auth, which compares URLs when it decides
  # which origins and redirects to trust. One patch release, same major.
  fast-uri: ^3.1.8
  # GHSA-r5fr-rjxr-66jc and GHSA-f23m-r3pf-42rh: lodash-es through
  # mermaid > chevrotain. These were ignored until 4.18.1 shipped the fix;
  # same major, so chevrotain keeps its API.
  lodash-es: ^4.18.1
  # GHSA-68fv-2mgg-jv7q (high): event-loop denial of service from crafted
  # source-map offsets. Reached through Prisma's config loader and the build
  # toolchain. One patch release, same major.
  source-map-js: ^1.2.2
  # GHSA-p98j-92pf-mc4p and GHSA-6688-9rhm-gjv2 (low): sanitiser bypasses.
  # mermaid uses DOMPurify to clean the diagrams members write before they
  # reach a visitor's browser, so this one is worth having even though it is
  # rated low. Same major.
  dompurify: ^3.4.16

# Advisories left open deliberately, with the reason. Review each one whenever
# `pnpm audit` changes, and delete the entry the moment a patched release
# exists.
#
# GHSA-vfj7-8cjw-p6xm (high): braces, stack exhaustion from deeply nested
# patterns. No patched release exists (the advisory lists none; 3.0.3 is the
# newest). It is reached only through eslint-config-next > fast-glob >
# micromatch — lint tooling in devDependencies, absent from the production
# tree — and the patterns it expands are the repository's own lint globs, never
# input from a visitor.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
