confirmModulesPurge: false

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: false

# Patched releases for advisories reached only through the Prisma CLI
# (Studio's charts, MySQL support, and config loading). lodash and mysql2 stay
# within their major version; deepmerge-ts 8 keeps the API @prisma/config uses.
overrides:
  deepmerge-ts: ^8.0.0
  lodash: ^4.18.1
  mysql2: ^3.23.4
